project: MiniMax-H3-AI-Video-Generator

backend:
  name: minimax-h3
  mode: ref2va
  quantization: q4-gguf

models:
  diffusion_checkpoint:
    file: minimax_h3_ref2va_pruned-Q4_K_M.gguf
    directory: diffusion_models

  text_encoder:
    file: qwen3vl_32b_minimax_h3-Q4_K_M.gguf
    directory: text_encoders

  mmproj:
    file: Qwen3-VL-32B-Instruct-MiniMax-H3-L0-49-mmproj-BF16.gguf
    directory: text_encoders

  video_vae:
    file: minimax_h3_video_vae_fp16.safetensors
    directory: vae

  audio_vae:
    file: minimax_h3_audio_vae_fp32.safetensors
    directory: vae

references:
  max_images: 9
  max_videos: 3
  max_video_audio: 3
  max_audio: 3

identity:
  structured_character_profile: true
  reference_images: true
  reference_video: true
  reference_audio: true
  memory_continuity: true

retired:
  ltx_ic_lora: true
  ltx_detailer: true
  ltx_spatial_upscaler: true

runtime:
  qwen_unload_before_h3: true
  h3_text_encoder_eviction: true
  lowvram: true
  cpu_vae: true

multi_gpu:
  enabled: true
  strategy: scene_parallel
  workers:
    - gpu: 0
      port: 8188
    - gpu: 1
      port: 8189

delivery:
  width: 1280
  height: 720
  fps: 24
