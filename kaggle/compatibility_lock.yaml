project: MiniMax-H3-AI-Video-Generator
backend: minimax-h3-ref2va
model:
  family: MiniMax-H3
  mode: Ref2VA
  quantization: Q4_GGUF
  diffusion_checkpoint: minimax_h3_ref2va_pruned-Q4_K_M.gguf
  text_encoder: qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  mmproj: Qwen3-VL-32B-Instruct-MiniMax-H3-L0-49-mmproj-BF16.gguf
  video_vae: minimax_h3_video_vae_fp16.safetensors
  audio_vae: minimax_h3_audio_vae_fp32.safetensors

generation:
  fps: 24
  width: 960
  height: 544
  delivery_width: 1280
  delivery_height: 720
  frames_per_shot: 124
  steps: 14

references:
  max_images_per_generation: 9
  max_reference_videos: 1
  voice_reference_lanes: 1
  image_reference_policy: independent_slots
  composite_reference_policy: forbidden

runtime:
  comfyui_port: 8188
  text_encoder_eviction: true
  quantized_offload: true

custom_nodes:
  - ComfyUI-GGUF
  - ComfyUI-H3-Multishot
  - ComfyUI-VideoHelperSuite
