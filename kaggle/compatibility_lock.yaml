# LTX-13B modern production compatibility lock
# Proven by live Kaggle GPU execution on 2026-08-18.

comfyui:
  repository: https://github.com/Comfy-Org/ComfyUI.git
  tag: v0.33.1
  commit: 72865f4f27eaf5396f8f36370e0a2be3a9a090ee

  frontend:
    package: comfyui-frontend-package
    version: 1.48.7

  workflow_templates:
    package: comfyui-workflow-templates
    version: 0.11.41

  embedded_docs:
    package: comfyui-embedded-docs
    version: 0.5.9

  comfy_kitchen:
    package: comfy-kitchen
    version: 0.2.31

  comfy_aimdo:
    package: comfy-aimdo
    version: 0.4.13

python_runtime:
  torch: 2.10.0+cu128
  torchvision: 0.25.0+cu128
  torchsde: 0.2.6
  spandrel: 0.4.2
  av: 18.1.0
  gguf: 0.19.0

custom_nodes:
  ComfyUI-LTXVideo:
    repository: https://github.com/Lightricks/ComfyUI-LTXVideo.git
    commit: ac4d99839020b983e956a8ab67ec38aec1b6e65a

  ComfyUI-KJNodes:
    repository: https://github.com/kijai/ComfyUI-KJNodes.git
    commit: 7ecb190ef91d988420cf0e682efb79ac7433c0b7

  ComfyUI-VideoHelperSuite:
    repository: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git
    commit: 4ee72c065db22c9d96c2427954dc69e7b908444b

  ComfyUI-GGUF:
    repository: https://github.com/city96/ComfyUI-GGUF.git
    commit: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a

legacy_ltx_098_compat:
  repository: https://github.com/Lightricks/ComfyUI-LTXVideo.git
  commit: ee11be3ce229c3afd5fadf8a1258eb8b84af33b1

  runtime_package: LTX098ModernCompat

  required_nodes:
    - LTXVBaseSampler
    - LTXVLoopingSampler
    - LTXVTiledSampler
    - LTXVTiledVAEDecode
    - LTXVLatentUpsampler
    - LTXVLatentUpsamplerModelLoader
    - LTXVFilmGrain
    - STGGuiderAdvanced
    - Set VAE Decoder Noise

  patches:
    blur_internal:
      signature: "blur_internal(image, blur_radius)"
      implementation: "native torch Gaussian blur"
      workflow_blur: 1

detailer_compat:
  legacy_loader: LTXVLatentUpsamplerModelLoader
  modern_loader: LatentUpscaleModelLoader
  output_type: LATENT_UPSCALE_MODEL
  model_directory: models/latent_upscale_models

models:
  ltx_q4:
    dataset: /kaggle/input/datasets/shihoos/ltx13b-q4
    filename: LTXV-13B-0.9.8-distilled-Q4_K_M.gguf
    target: models/unet/LTXV-13B-0.9.8-distilled-Q4_K_M.gguf

  t5_q4:
    dataset: /kaggle/input/datasets/shihoos/ltx13b-t5
    filename: t5-v1_1-xxl-encoder-Q4_K_M.gguf
    target: models/clip/t5-v1_1-xxl-encoder-Q4_K_M.gguf

  vae:
    dataset: /kaggle/input/datasets/shihoos/ltx13b-vae
    filename: LTXV-13B-0.9.8-distilled-VAE.safetensors
    target: models/vae/LTXV-13B-0.9.8-distilled-VAE.safetensors

  ic_lora:
    dataset: /kaggle/input/datasets/shihoos/ltx13b-enhancers
    filename: ltxv-098-ic-lora-detailer-comfyui.safetensors
    target: models/loras/ltxv-098-ic-lora-detailer-comfyui.safetensors

  spatial_upscaler:
    dataset: /kaggle/input/datasets/shihoos/ltx13b-enhancers
    filename: ltxv-spatial-upscaler-0.9.8.safetensors
    target: models/latent_upscale_models/ltxv-spatial-upscaler-0.9.8.safetensors

validation:
  base:
    frames: 97
    fps: 24
    duration_seconds: 4.041667
    output_resolution: 768x416

  detailer:
    frames: 97
    fps: 24
    duration_seconds: 4.041667
    output_resolution: 1536x832

  timing:
    old_stack_base_seconds: 495
    modern_stack_base_seconds: 303
    old_stack_detailer_seconds: 1140
    modern_stack_detailer_seconds: 945
    old_stack_total_seconds: 1635
    modern_stack_total_seconds: 1248
