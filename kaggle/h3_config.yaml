dataset_name: minimax-h3-ref2va-q4
backend: minimax-h3
mode: ref2va

models:
  diffusion_model: minimax_h3_ref2va_pruned-Q4_K_M.gguf
  text_encoder: qwen3vl_32b_minimax_h3-Q4_K_M.gguf
  mmproj: Qwen3-VL-32B-Instruct-MiniMax-H3-L0-49-mmproj-BF16.gguf
  video_vae: minimax_h3_video_vae_fp16.safetensors
  audio_vae: minimax_h3_audio_vae_fp32.safetensors

generation:
  fps: 24
  width: 960
  height: 544
  frames_per_shot: 124
  steps: 14
  sampler: res_multistep
  scheduler: beta
  ref_image_size: match

references:
  max_images: 9
  max_videos: 3
  max_video_audio: 3
  max_audio: 3
  composite_reference: false

identity:
  structured_profile: true
  face: true
  hair: true
  body: true
  skin_tone: true
  clothing: true
  accessories: true
  distinctive_features: true
  character_state: true
  continuity_rules: true

continuity:
  first_shot: native_ref2va
  later_shots: h3_memory
  last_frame_anchor: true

offload:
  qwen_planner_unload_before_h3: true
  h3_text_encoder_eviction: true
  cpu_vae: true
  lowvram: true

multi_gpu:
  enabled: true
  mode: scene_parallel
  base_port: 8188
  workers:
    - gpu: 0
      port: 8188
    - gpu: 1
      port: 8189

delivery:
  width: 1280
  height: 720
  fps: 24
  codec: h264
  audio_codec: aac
